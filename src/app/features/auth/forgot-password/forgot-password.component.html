<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
  <div class="rounded-card border border-brand-navy/10 bg-white p-8 shadow-card">
    <h1 class="font-heading text-2xl font-bold text-brand-navy">Recuperar contraseña</h1>
    <p class="mt-1 text-sm text-brand-gray">Te enviaremos un enlace a tu correo para restablecerla.</p>

    <ui-alert *ngIf="errorMessage()" tone="danger" class="mt-4 block">{{ errorMessage() }}</ui-alert>
    <ui-alert *ngIf="successMessage()" tone="success" class="mt-4 block">{{ successMessage() }}</ui-alert>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4" novalidate>
      <ui-input
        label="Correo electrónico"
        type="email"
        formControlName="email"
        autocomplete="email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo válido.' : ''"
      ></ui-input>

      <ui-button type="submit" [loading]="loading()" class="block w-full">
        <span class="w-full">Enviar enlace</span>
      </ui-button>
    </form>

    <p class="mt-6 text-center text-sm text-brand-gray">
      <a routerLink="/acceso/login" class="font-medium text-brand-blue hover:underline">Volver a iniciar sesión</a>
    </p>
  </div>
</section>
