<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
  <div class="rounded-card border border-brand-navy/10 bg-white p-8 shadow-card dark:border-white/10 dark:bg-brand-navy/40">
    <h1 class="font-heading text-2xl font-bold text-brand-navy dark:text-white">Crear cuenta</h1>
    <p class="mt-1 text-sm text-brand-gray dark:text-white/60">Regístrate para probar el panel SaaS de InvenTech.</p>

    <ui-alert *ngIf="errorMessage()" tone="danger" class="mt-4 block">{{ errorMessage() }}</ui-alert>
    <ui-alert *ngIf="successMessage()" tone="success" class="mt-4 block">{{ successMessage() }}</ui-alert>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4" novalidate>
      <ui-input
        label="Nombre completo"
        formControlName="fullName"
        autocomplete="name"
        [error]="form.controls.fullName.touched && form.controls.fullName.invalid ? 'Ingresa tu nombre completo.' : ''"
      ></ui-input>

      <ui-input
        label="Correo electrónico"
        type="email"
        formControlName="email"
        autocomplete="email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo válido.' : ''"
      ></ui-input>

      <ui-input
        label="Contraseña"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        hint="Mínimo 6 caracteres."
        [error]="form.controls.password.touched && form.controls.password.invalid ? 'La contraseña debe tener al menos 6 caracteres.' : ''"
      ></ui-input>

      <ui-button type="submit" [loading]="loading()" class="block w-full">
        <span class="w-full">Crear cuenta</span>
      </ui-button>
    </form>

    <p class="mt-6 text-center text-sm text-brand-gray dark:text-white/60">
      ¿Ya tienes cuenta?
      <a routerLink="/acceso/login" class="font-medium text-brand-blue hover:underline">Inicia sesión</a>
    </p>
  </div>
</section>
