<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
  <div class="rounded-card border border-brand-navy/10 bg-white p-8 shadow-card">
    <h1 class="font-heading text-2xl font-bold text-brand-navy">Iniciar sesión</h1>
    <p class="mt-1 text-sm text-brand-gray">Accede al panel de InvenTech con tu cuenta.</p>

    <ui-alert *ngIf="errorMessage()" tone="danger" class="mt-4 block">{{ errorMessage() }}</ui-alert>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4" novalidate>
      <ui-input
        label="Correo electrónico"
        type="email"
        formControlName="email"
        autocomplete="email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo válido.' : ''"
      ></ui-input>

      <ui-input
        label="Contraseña"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [error]="form.controls.password.touched && form.controls.password.invalid ? 'La contraseña es obligatoria.' : ''"
      ></ui-input>

      <div class="flex justify-end">
        <a routerLink="/acceso/recuperar" class="text-sm text-brand-blue hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <ui-button type="submit" [loading]="loading()" class="block w-full">
        <span class="w-full">Iniciar sesión</span>
      </ui-button>
    </form>

    <p class="mt-6 text-center text-sm text-brand-gray">
      ¿No tienes cuenta?
      <a routerLink="/acceso/registro" class="font-medium text-brand-blue hover:underline">Regístrate</a>
    </p>
  </div>
</section>
