<header class="sticky top-0 z-40 border-b border-brand-navy/10 bg-white/90 backdrop-blur transition-colors dark:border-white/10 dark:bg-brand-navy/90">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8" aria-label="Navegación principal">
    <a routerLink="/" class="flex items-center gap-2" (click)="closeMenu()">
      <app-logo size="md"></app-logo>
    </a>

    <ul class="hidden items-center gap-1 md:flex">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-brand-blue bg-brand-blue/5"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="rounded-control px-3 py-2 text-sm font-medium text-brand-navy transition-colors hover:bg-brand-navy/5 dark:text-white dark:hover:bg-white/10"
        >
          {{ item.label }}
        </a>
      </li>
    </ul>

    <div class="hidden items-center gap-2 md:flex">
      <app-theme-toggle></app-theme-toggle>
      <a routerLink="/acceso/login" class="rounded-control px-3 py-2 text-sm font-medium text-brand-navy hover:bg-brand-navy/5 dark:text-white dark:hover:bg-white/10">
        Iniciar sesión
      </a>
      <a routerLink="/acceso/panel" class="rounded-control bg-brand-blue px-4 py-2 text-sm font-medium text-white hover:bg-brand-blue/90">
        Ir al panel
      </a>
    </div>

    <div class="flex items-center gap-1 md:hidden">
      <app-theme-toggle></app-theme-toggle>
    <button
      type="button"
      class="inline-flex items-center justify-center rounded-control p-2 text-brand-navy hover:bg-brand-navy/5 dark:text-white dark:hover:bg-white/10"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
      (click)="toggleMenu()"
    >
      <svg *ngIf="!menuOpen()" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg *ngIf="menuOpen()" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    </div>
  </nav>

  <div id="mobile-menu" *ngIf="menuOpen()" class="border-t border-brand-navy/10 dark:border-white/10 md:hidden">
    <ul class="space-y-1 px-4 py-3">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-brand-blue bg-brand-blue/5"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="block rounded-control px-3 py-2 text-sm font-medium text-brand-navy hover:bg-brand-navy/5 dark:text-white dark:hover:bg-white/10"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      </li>
      <li class="pt-2">
        <a routerLink="/acceso/login" class="block rounded-control px-3 py-2 text-sm font-medium text-brand-navy hover:bg-brand-navy/5 dark:text-white dark:hover:bg-white/10" (click)="closeMenu()">
          Iniciar sesión
        </a>
      </li>
      <li>
        <a routerLink="/acceso/panel" class="block rounded-control bg-brand-blue px-3 py-2 text-sm font-medium text-white" (click)="closeMenu()">
          Ir al panel
        </a>
      </li>
    </ul>
  </div>
</header>
